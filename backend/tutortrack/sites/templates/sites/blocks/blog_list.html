{% load i18n %}{% if d.posts %}<section aria-labelledby="{{ block.id }}-h"><div class="wrap">
  <h2 id="{{ block.id }}-h">{{ p.heading|default:_("Latest news") }}</h2>
  <ul class="grid">{% for post in d.posts %}<li><article class="card">
    <h3><a href="{{ post.href }}">{{ post.title }}</a></h3>
    <p class="muted"><time datetime="{{ post.published_at|date:'c' }}">{{ post.published_at|date:"j F Y" }}</time></p>
    <p>{{ post.excerpt }}</p>
  </article></li>{% endfor %}</ul>
  <p><a href="/blog">{% trans "All posts" %}</a></p>
</div></section>{% endif %}
