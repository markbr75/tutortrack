[project]
name = "tutortrack"
version = "0.1.0"
description = "TutorTrack: run a tutoring business end to end"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django[argon2]>=5.2,<5.3",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "django-filter>=25.1",
    "django-environ>=0.12",
    "django-cors-headers>=4.7",
    "django-redis>=5.4",
    "django-storages[s3]>=1.14",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.5",
    "redis>=5.2",
    "structlog>=25.1",
    "sentry-sdk[django,celery]>=2.27",
    "opentelemetry-sdk>=1.32",
    "opentelemetry-exporter-otlp-proto-http>=1.32",
    "opentelemetry-instrumentation-django>=0.53b0",
    "opentelemetry-instrumentation-celery>=0.53b0",
    "opentelemetry-instrumentation-psycopg>=0.53b0",
    "opentelemetry-instrumentation-redis>=0.53b0",
    "python-dateutil>=2.9",
    "uuid6>=2024.7.10",
    "babel>=2.17",
    "boto3>=1.38",
    "gunicorn>=23.0",
    "pyotp>=2.9",
    "zxcvbn>=4.5",
    "pyjwt[crypto]>=2.10",
    "segno>=1.6",
    "temporalio>=1.11",
    "nh3>=0.2.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.11",
    "pytest-xdist>=3.6",
    "pytest-cov>=6.1",
    "factory-boy>=3.3",
    "hypothesis>=6.131",
    "moto[s3]>=5.1",
    "fakeredis[lua]>=2.29",
    "ruff>=0.11.8",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.2",
    "djangorestframework-stubs[compatible-mypy]>=3.16",
    "types-python-dateutil",
    "types-redis",
    "boto3-stubs[s3]",
    "celery-types",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "SIM", "RUF", "PT", "C4", "DTZ", "T20"]
ignore = [
    "RUF012", # mutable class attributes are idiomatic in Django Meta/DRF
    "DJ001",  # null=True on CharField is used deliberately in a few places
    "UP046", "UP047",  # PEP 695 generics: Semgrep (SAST, E29) cannot parse them yet
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311", "DTZ", "PT012"]
"tutortrack/core/testing.py" = ["S101"]
"config/settings/*" = ["S105", "F405", "F403"]
"conftest.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["tutortrack", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
files = ["tutortrack", "config"]
exclude = ["migrations/", "tests/"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

# Strict typing on the domain primitives (services/selectors get strict as each app lands).
[[tool.mypy.overrides]]
module = ["tutortrack.core.money", "tutortrack.core.time", "tutortrack.core.sequences", "tutortrack.core.events.*"]
disallow_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers --reuse-db -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]

[tool.coverage.run]
source = ["tutortrack"]
omit = ["*/migrations/*", "*/tests/*"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
