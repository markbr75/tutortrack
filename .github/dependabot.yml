# Dependency updates (E29-T01). Grouped weekly to keep the PR volume manageable.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      javascript: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    # The image's Python must match requires-python in backend/pyproject.toml (3.12):
    # take patch updates only and move to a newer Python on purpose, not by bot.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
