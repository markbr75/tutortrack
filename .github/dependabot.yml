# Dependency updates (E29-T01). Grouped weekly to keep the PR volume manageable.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      # Grouped minor/patch only: majors come as separate PRs to review one by one.
      python: { patterns: ["*"], update-types: ["minor", "patch"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      # Grouped minor/patch only: majors come as separate PRs to review one by one.
      javascript: { patterns: ["*"], update-types: ["minor", "patch"] }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
