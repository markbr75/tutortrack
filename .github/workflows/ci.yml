name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On pull requests, run the backend and frontend jobs only when their area (or CI itself)
  # changed. Pushes to main always run everything: a new push cancels the run in progress
  # (see concurrency), so filtering there could leave a cancelled commit's changes untested.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            { echo "backend=true"; echo "frontend=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request checks out its merge commit, whose first parent is the base tip.
          changed=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$changed"
          ci='^\.github/(workflows/ci\.yml|actions/)'
          area() { printf '%s\n' "$changed" | grep -qE "$ci|$1" && echo true || echo false; }
          { echo "backend=$(area '^backend/')"; echo "frontend=$(area '^frontend/')"; } \
            | tee -a "$GITHUB_OUTPUT"

  # Lint, types, migrations and deploy checks: no database needed (makemigrations only warns
  # that it can't check the migration history).
  backend-checks:
    name: backend checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://tutortrack_app:tutortrack_app@localhost:5442/tutortrack
      DATABASE_OWNER_URL: postgres://tutortrack:tutortrack@localhost:5442/tutortrack
      DATABASE_PLATFORM_URL: postgres://tutortrack_platform:tutortrack_platform@localhost:5442/tutortrack
      REDIS_URL: redis://localhost:6389/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: PDF libraries (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Migrations are up to date
        run: |
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Deploy checks
        run: uv run python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod
        env:
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-value-0123456789
          TURNSTILE_SECRET_KEY: ci-only-not-a-real-key
          FIELD_ENCRYPTION_KEYS: DbyhxHUuYW0d6P-VFWYHcV9sWb7MmEwUC9RsDpmJpS8=
          TEMPORAL_PAYLOAD_KEYS: ci:3q2+7wABAgMEBQYHCAkKCwwNDg8QERITFBUWFxgZGhs=

  # The tests in two parallel groups of about equal duration (pytest-split reads
  # backend/.test_durations; refresh it with scripts/test_durations.py). Each group keeps its
  # raw coverage data; backend-coverage combines them and enforces the threshold.
  backend:
    name: backend tests (${{ matrix.group }}/2)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tutortrack
          POSTGRES_PASSWORD: tutortrack
          POSTGRES_DB: tutortrack
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U tutortrack" --health-interval 5s --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6389:6379"]
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://tutortrack_app:tutortrack_app@localhost:5442/tutortrack
      DATABASE_OWNER_URL: postgres://tutortrack:tutortrack@localhost:5442/tutortrack
      DATABASE_PLATFORM_URL: postgres://tutortrack_platform:tutortrack_platform@localhost:5442/tutortrack
      REDIS_URL: redis://localhost:6389/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: PDF libraries (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: uv sync --frozen
      # Test flushes TRUNCATE every table in one statement (a lock each); service containers
      # can't take server flags, so raise the lock table and restart (as docker-compose does).
      # The CI database is throwaway, so skip durability work too: with fsync on, each flush
      # (after every transactional/Temporal test) took ~6.5s; without it, ~1.4s.
      - name: Postgres settings for tests
        run: |
          pg=$(docker ps -qf "ancestor=postgres:16-alpine")
          for setting in "max_locks_per_transaction = 512" "fsync = off" \
            "synchronous_commit = off" "full_page_writes = off"; do
            docker exec "$pg" psql -U tutortrack -c "ALTER SYSTEM SET $setting"
          done
          docker restart "$pg"
          for i in $(seq 1 30); do docker exec "$pg" pg_isready -U tutortrack && break; sleep 1; done
          docker exec "$pg" psql -U tutortrack -Atc "SELECT name || ' = ' || setting FROM pg_settings
            WHERE name IN ('fsync', 'synchronous_commit', 'full_page_writes', 'max_locks_per_transaction')"
      - name: Database roles (app role is subject to RLS)
        run: uv run python manage.py ensure_db_roles
      # Migrate once; each xdist worker's test database is a copy of this one (TEST_DB_TEMPLATE
      # in config/settings/test.py), instead of every worker migrating from scratch.
      # The migrated template only changes with the schema, so a dump of it is cached. The key
      # covers what `migrate` runs: migrations, the app modules they import, the post_migrate
      # grants, the settings and the dependency lock. Bump "v1" to force a rebuild.
      - name: Restore the cached template database
        id: template-cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/test-db-template.dump
          key: >-
            test-db-template-v1-pg16-${{ hashFiles(
              'backend/**/migrations/*.py',
              'backend/tutortrack/core/ids.py',
              'backend/tutortrack/core/migrations_utils.py',
              'backend/tutortrack/core/fields.py',
              'backend/tutortrack/core/crypto.py',
              'backend/tutortrack/core/dbroles.py',
              'backend/tutortrack/core/apps.py',
              'backend/tutortrack/subscriptions/catalogue.py',
              'backend/tutortrack/people/models.py',
              'backend/tutortrack/identity/models.py',
              'backend/tutortrack/scheduling/models.py',
              'backend/tutortrack/core/tests/testapp/models.py',
              'backend/config/settings/base.py',
              'backend/config/settings/test.py',
              'backend/uv.lock') }}
      - name: Template test database
        env:
          DATABASE_URL: postgres://tutortrack_app:tutortrack_app@localhost:5442/tutortrack_test_template
          DATABASE_OWNER_URL: postgres://tutortrack:tutortrack@localhost:5442/tutortrack_test_template
          CACHE_HIT: ${{ steps.template-cache.outputs.cache-hit }}
        run: |
          pg=$(docker ps -qf "ancestor=postgres:16-alpine")
          docker exec "$pg" psql -U tutortrack -c "CREATE DATABASE tutortrack_test_template"
          if [ "$CACHE_HIT" = true ]; then
            echo "Restoring the cached template"
            docker exec -i "$pg" pg_restore -U tutortrack -d tutortrack_test_template \
              --exit-on-error < /tmp/test-db-template.dump
            # Safety net: fails if the dump is missing a migration the code has.
            uv run python manage.py migrate --check --settings=config.settings.test
          else
            echo "No cached template: migrating"
            uv run python manage.py migrate --settings=config.settings.test -v0
            docker exec "$pg" pg_dump -U tutortrack -Fc tutortrack_test_template \
              > /tmp/test-db-template.dump
          fi
      - name: Cache the template database
        if: steps.template-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/test-db-template.dump
          key: ${{ steps.template-cache.outputs.cache-primary-key }}
      - name: Tests
        env:
          TEST_DB_TEMPLATE: tutortrack_test_template
        run: |
          uv run pytest -n auto --splits 2 --group ${{ matrix.group }} \
            --splitting-algorithm least_duration \
            --cov --cov-report= --cov-fail-under=0 --junitxml=junit.xml --durations=50
          mv .coverage .coverage.group-${{ matrix.group }}
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-data-${{ matrix.group }}
          path: backend/.coverage.group-${{ matrix.group }}
          include-hidden-files: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-junit-${{ matrix.group }}
          path: backend/junit.xml

  backend-coverage:
    name: backend coverage
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/download-artifact@v7
        with:
          pattern: backend-coverage-data-*
          merge-multiple: true
          path: backend
      - name: Combine and check coverage (fail_under in pyproject.toml)
        run: |
          uv run coverage combine
          uv run coverage report
          uv run coverage xml
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build

  contract:
    name: OpenAPI / client drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Regenerate schema and TypeScript client
        run: |
          cd backend
          uv run python manage.py spectacular --validate --fail-on-warn --format openapi-json \
            --file ../frontend/packages/api-client/openapi.json
          cd ../frontend
          pnpm --filter @tutortrack/api-client generate
      - name: Fail if the committed client is stale
        run: git diff --exit-code -- frontend/packages/api-client/
      - name: Fail if the guides or README are stale (docs/guides/README.md)
        run: uv run python manage.py guides --check
        working-directory: backend

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # secret scanning covers the whole history
      - name: Secret scanning (gitleaks)
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo zricethezav/gitleaks:v8.21.2
          detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact
      - name: SAST (Semgrep; Bandit rules run in ruff)
        run: >-
          docker run --rm -v "$PWD/backend":/src -w /src semgrep/semgrep:1.140.0
          semgrep scan --config p/django --config p/python --config p/secrets --metrics=off
          --error --quiet --exclude .venv --exclude "**/migrations/**" --exclude "**/tests/**"
      - uses: astral-sh/setup-uv@v7
      - name: Python dependency audit (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --format requirements-txt --no-hashes > /tmp/req.txt
          uvx pip-audit@2.9.0 -r /tmp/req.txt --disable-pip --no-deps
      - uses: ./.github/actions/setup-pnpm
      - name: JavaScript dependency audit
        working-directory: frontend
        run: pnpm audit --prod --audit-level high

  e2e:
    if: github.event_name == 'push'
    needs: [backend-checks, backend-coverage, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The journeys (docs/test-plan/README.md) need Temporal reachable (workflows start, no
      # worker needed), events handled in-process, the console without 2FA, and room for
      # many sign-ins and public form posts (the specs run in parallel with retries).
      - name: Start backend stack
        run: |
          cp .env.example .env
          sed -i 's/^CELERY_TASK_ALWAYS_EAGER=.*/CELERY_TASK_ALWAYS_EAGER=true/' .env
          printf 'PLATFORM_REQUIRE_MFA=false\nTHROTTLE_PUBLIC_FORM=1000/hour\nTHROTTLE_LOGIN=600/minute\n' >> .env
          docker compose up -d --build --wait backend temporal
          docker compose exec -T backend uv run python manage.py seed_demo
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      # Test the production bundle (vite preview reuses the dev proxy to the API), not the
      # dev server: a cold dev server re-optimises dependencies mid-test.
      # The admin preview proxies /api to :8010 and /portal to the portal preview on :5174,
      # so both apps share the organisation's host as in production.
      - name: Build and serve the admin and portal apps
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8010
        run: |
          pnpm --filter @tutortrack/admin build
          pnpm --filter @tutortrack/portal build
          nohup pnpm --filter @tutortrack/portal preview --host 0.0.0.0 --port 5174 --strictPort > /tmp/preview-portal.log 2>&1 &
          nohup pnpm --filter @tutortrack/admin preview --host 0.0.0.0 --port 5173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:5173/ && curl -sf -o /dev/null http://localhost:5174/portal/ && break; sleep 1; done
      - run: pnpm e2e --project=chromium
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: frontend/test-results/
          retention-days: 7
      - if: failure()
        run: docker compose logs --tail=200; cat /tmp/preview.log /tmp/preview-portal.log || true
