<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widgets playground</title>
    <!-- Local: the seeded organisation's API; add http://localhost:5175 to a widget's
         allowed origins (the seed does this for its tutor directory widget). -->
    <script
      type="module"
      src="/src/index.ts"
      data-org="brightminds"
      data-api="http://brightminds.localhost:8010"
    ></script>
  </head>
  <body>
    <main style="max-width: 960px; margin: 0 auto; padding: 16px">
      <h1>Widgets playground</h1>
      <h2>Tutor directory</h2>
      <tt-tutor-directory></tt-tutor-directory>
      <h2>Reviews</h2>
      <tt-reviews></tt-reviews>
      <h2>Services</h2>
      <tt-services></tt-services>
      <h2>Login</h2>
      <tt-login portal="client"></tt-login>
    </main>
  </body>
</html>
